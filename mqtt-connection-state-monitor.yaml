blueprint:
  name: MQTT Connection State Monitor
  author: dabo53ck

  homeassistant:
    min_version: "2024.6.0"

  description: >-
    # MQTT Connection State Monitor
    
    ![Version](https://img.shields.io/badge/version-0.1.0_beta-orange) &nbsp;&nbsp;&nbsp; [![GitHub](https://img.shields.io/badge/GitHub-Repository-black)](https://github.com/dabo53ck/mqtt-connection-state-monitor) &nbsp;&nbsp;&nbsp; [![Issues](https://img.shields.io/badge/Issues-red)](https://github.com/dabo53ck/mqtt-connection-state-monitor/issues) &nbsp;&nbsp;&nbsp; [![Community](https://img.shields.io/badge/Community-purple)](https://community.home-assistant.io/t/release-mqtt-connection-state-monitor-for-home-assistant/)
    
    
    Monitor your MQTT-connected devices and receive timely notifications when they go offline. Unlike basic connectivity checks, this blueprint implements **delayed detection** to avoid false alarms from brief connection drops, while maintaining robust duplicate protection so you're not spammed with repeated alerts.
    
    
    Built on top of the excellent [MQTT Connection State integration](https://github.com/studioIngrid/mqtt_connection_state) by [@studioIngrid](https://github.com/studioIngrid) – thank you for the great foundation!
    
    Full documentation and action examples are available on [GitHub](https://github.com/dabo53ck/mqtt-connection-state-monitor).
    
    
    <details><summary>Key Features</summary>
    
    • **Configurable offline threshold** – Choose how long a device must stay offline before triggering (default: 180 minutes)
    • **Duplicate notification protection** – Each device is only notified once per offline event
    • **Flexible notification options** – Enable/disable offline and online notifications independently
    • **Custom actions support** – Run scripts, webhooks, Telegram/Discord messages alongside or instead of Companion App notifications
    • **Automatic recovery handling** – Tracks when devices come back online and clears from notification queue
    • **Device exclusion list** – Exclude specific entities from monitoring
    • **iOS notification grouping** – Consolidates alerts into a single grouped notification
    • **Rich context variables** – Pass device details, timestamps, and durations to custom actions
    
    </details>
    
    
    <details><summary>Requirements</summary>
    
    • Home Assistant 2024.6.0 or newer
    • [MQTT Connection State integration](https://github.com/studioIngrid/mqtt_connection_state) (installed separately via HACS)
    • One Input Text helper with maximum length of 255 characters (for tracking notified devices)
    
    </details>
    
    
    <details><summary>Known Limitation</summary>
    
    Due to the 255-character limit of Input Text helpers, approximately **10-15 devices** can be tracked simultaneously depending on device name lengths. For larger deployments, consider splitting into multiple blueprints with separate helpers.
    
    </details>
  
  domain: automation

  source_url: https://github.com/dabo53ck/mqtt-connection-state-monitor

  input:

    notifications:
      name: Notifications
      icon: mdi:bell
      collapsed: false
      input:

        offline_notifications_enabled:
          name: Enable Offline Notifications
          description: >
            Send a Companion App notification when a device has been
            offline longer than the configured duration.
          default: true
          selector:
            boolean:

        online_notifications_enabled:
          name: Enable Online Notifications
          description: >
            Send a Companion App notification when a previously tracked
            offline device comes back online.
          default: true
          selector:
            boolean:

        mobile_device:
          name: Notification Device
          description: >
            Mobile device used for Companion App notifications.

            Only required when Companion App notifications are enabled.
          default: ""
          selector:
            device:
              filter:
                integration: mobile_app

    actions:
      name: Actions
      icon: mdi:lightning-bolt
      collapsed: false
      input:

        offline_actions:
          name: Offline Actions
          description: >
            Optional actions executed when a device goes offline.

            Available variables:
              • device_name
              • friendly_name
              • entity_id
              • offline_seconds
              • threshold_seconds
              • offline_time
              • offline_timestamp

            Examples:

            Telegram:
              Device {{ friendly_name }} is offline.

            Persistent Notification:
              {{ friendly_name }} has been offline for
              {{ offline_seconds }} seconds.

            Script:
              Pass {{ entity_id }} to another script.
          default: []
          selector:
            action: {}

        online_actions:
          name: Online Actions
          description: >
            Optional actions executed when a device comes back online.

            Available variables:
              • device_name
              • friendly_name
              • entity_id
              • online_time
              • online_timestamp

            Examples:

            Telegram:
              Device {{ friendly_name }} is back online.

            Script:
              Pass {{ entity_id }} to another script.
          default: []
          selector:
            action: {}

    monitoring_options:
      name: Monitoring Options
      icon: mdi:cog-transfer-outline
      collapsed: false
      input:

        offline_duration_minutes:
          name: Offline Duration (minutes)
          description: >
            Time a device must remain offline before notifications
            and actions are executed.
          default: 180
          selector:
            number:
              min: 1
              max: 10080
              mode: box
              unit_of_measurement: minutes

        exclude_entities:
          name: Exclude Devices
          description: >
            Select devices that should be excluded from monitoring.
            Shows binary_sensors with device_class 'connectivity'.
            Select entities that end with '_connection_state'.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
                device_class: connectivity

        notified_helper:
          name: Notification Tracking Helper
          description: >
            Input Text helper used internally to prevent duplicate
            offline notifications.

            Create one Input Text helper with maximum length of 255.
          selector:
            entity:
              domain: input_text

mode: single
max_exceeded: silent

trigger:
  - platform: time_pattern
    minutes: "/15"

  - platform: event
    event_type: mqtt_connection_state_changed

variables:
  offline_notifications_enabled: !input offline_notifications_enabled
  online_notifications_enabled: !input online_notifications_enabled
  mobile_device: !input mobile_device
  notified_helper: !input notified_helper
  exclude_entities: !input exclude_entities
  offline_duration_minutes: !input offline_duration_minutes

  threshold_seconds: >
    {{ (offline_duration_minutes | int(180)) * 60 }}

action:

  - choose:

      #
      # DEVICE BACK ONLINE
      #
      - conditions:
          - condition: template
            value_template: >
              {{
                trigger.platform == 'event'
                and trigger.event.data.state == 'online'
              }}

        sequence:

          - variables:

              entity_id: >
                {{ trigger.event.data.entity_id }}

              device_name: >
                {{
                  trigger.event.data.entity_id
                  | replace('binary_sensor.', '')
                  | replace('_connection_state', '')
                }}

              current: >
                {% set raw = states(notified_helper) %}

                {% if raw in ['', 'unknown', 'unavailable'] %}
                  []
                {% else %}
                  {{ raw.split('|') }}
                {% endif %}

          - choose:

              #
              # ONLY CONTINUE IF DEVICE WAS PREVIOUSLY TRACKED
              #
              - conditions:
                  - condition: template
                    value_template: >
                      {{ device_name in current }}

                sequence:

                  - variables:

                      updated_list: >
                        {% set ns = namespace(items=[]) %}

                        {% for item in current %}
                          {% if item != device_name %}
                            {% set ns.items = ns.items + [item] %}
                          {% endif %}
                        {% endfor %}

                        {{ ns.items | join('|') }}

                  - service: input_text.set_value
                    target:
                      entity_id: !input notified_helper
                    data:
                      value: "{{ updated_list }}"

                  - variables:

                      friendly_name: >
                        {{
                          state_attr(
                            trigger.event.data.entity_id,
                            'friendly_name'
                          )
                          | default(
                              device_name
                              | replace('_', ' ')
                              | title,
                              true
                            )
                        }}

                      online_timestamp: "{{ now() }}"

                      online_time: >
                        {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

                  #
                  # OPTIONAL ONLINE NOTIFICATION
                  #
                  - choose:

                      - conditions:
                          - condition: template
                            value_template: >
                              {{
                                online_notifications_enabled
                                and mobile_device != ''
                              }}

                        sequence:

                          - device_id: !input mobile_device
                            domain: mobile_app
                            type: notify
                            title: >
                              🟢 {{ friendly_name }} online

                            message: >
                              {{ friendly_name }} is back online.

                            data:
                              group: mqtt_connection_state
                              notification_icon: "mdi:wifi"

                  #
                  # OPTIONAL ONLINE ACTIONS
                  #
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ true }}"
                        sequence: !input online_actions

      #
      # PERIODIC OFFLINE CHECK
      #
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.platform != 'event' }}

        sequence:

          - repeat:

              for_each: >
                {{
                  states.binary_sensor
                  | selectattr('entity_id', 'search', '_connection_state$')
                  | rejectattr('entity_id', 'in', exclude_entities)
                  | map(attribute='entity_id')
                  | list
                }}

              sequence:

                - variables:

                    entity_id: "{{ repeat.item }}"

                    device_name: >
                      {{
                        entity_id
                        | replace('binary_sensor.', '')
                        | replace('_connection_state', '')
                      }}

                    current_notified: >
                      {% set raw = states(notified_helper) %}

                      {% if raw in ['', 'unknown', 'unavailable'] %}
                        []
                      {% else %}
                        {{ raw.split('|') }}
                      {% endif %}

                    offline_seconds: >
                      {% set lc = states[entity_id].last_changed %}
                      {% if lc is none %}
                        {{ 0 }}
                      {% else %}
                        {{ (as_timestamp(now()) - as_timestamp(lc)) | int }}
                      {% endif %}

                    friendly_name: >
                      {{
                        state_attr(entity_id, 'friendly_name')
                        | default(
                            device_name
                            | replace('_', ' ')
                            | title,
                            true
                          )
                      }}

                - if:

                    - condition: template
                      value_template: >
                        {{
                          states(entity_id) == 'off'
                          and offline_seconds >= threshold_seconds
                          and device_name not in current_notified
                        }}

                  then:

                    #
                    # OPTIONAL OFFLINE NOTIFICATION
                    #
                    - choose:

                        - conditions:
                            - condition: template
                              value_template: >
                                {{
                                  offline_notifications_enabled
                                  and mobile_device != ''
                                }}

                          sequence:

                            - device_id: !input mobile_device
                              domain: mobile_app
                              type: notify
                              title: >
                                🔴 {{ friendly_name }} offline

                              message: >
                                {{ friendly_name }} has been offline for
                                {{ offline_duration_minutes }} minutes.

                              data:
                                group: mqtt_connection_state
                                notification_icon: "mdi:wifi-off"

                    - variables:

                        offline_timestamp: "{{ now() }}"

                        offline_time: >
                          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

                    #
                    # OPTIONAL OFFLINE ACTIONS
                    #
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ true }}"
                          sequence: !input offline_actions

                    #
                    # UPDATE HELPER
                    #
                    - variables:

                        new_value: >
                          {% set raw = states(notified_helper) %}

                          {% if raw in ['', 'unknown', 'unavailable'] %}
                            {{ device_name }}
                          {% else %}
                            {{ raw ~ '|' ~ device_name }}
                          {% endif %}

                    - service: input_text.set_value
                      target:
                        entity_id: !input notified_helper
                      data:
                        value: "{{ new_value }}"
