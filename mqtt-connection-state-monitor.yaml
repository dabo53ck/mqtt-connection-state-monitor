blueprint:
  name: MQTT Connection State Monitor
  author: dabo53ck
  homeassistant:
    min_version: "2026.3.0"
  description: |-
    # MQTT Connection State Monitor

    ![Version](https://img.shields.io/badge/version-0.3.1-blue) &nbsp;&nbsp;&nbsp; [![GitHub](https://img.shields.io/badge/GitHub-Repository-black)](https://github.com/dabo53ck/mqtt-connection-state-monitor) &nbsp;&nbsp;&nbsp; [![Issues](https://img.shields.io/badge/Issues-red)](https://github.com/dabo53ck/mqtt-connection-state-monitor/issues) &nbsp;&nbsp;&nbsp; [![Community](https://img.shields.io/badge/Community-Thread-blue)](https://community.home-assistant.io/t/release-mqtt-connection-state-monitor-for-home-assistant/)

    Monitor your MQTT-connected devices and receive timely notifications when they go offline. Unlike basic connectivity checks, this blueprint implements **delayed detection** to avoid false alarms from brief connection drops, while maintaining robust duplicate protection so you're not spammed with repeated alerts.

    Built on top of the excellent [MQTT Connection State integration](https://github.com/studioIngrid/mqtt_connection_state) by [@studioIngrid](https://github.com/studioIngrid) – thank you for the great foundation!

    Notifications are sent via the **Home Assistant Companion App** (iOS and Android). For other targets (Alexa, Telegram, SMTP, etc.), use the **Custom Actions** section. Full documentation and action examples are available on [GitHub](https://github.com/dabo53ck/mqtt-connection-state-monitor).

    <details><summary>Key Features</summary>

    • **Configurable offline threshold** – Choose how long a device must stay offline before triggering (default: 3 hours)
    • **Battery-device offline threshold** – Optional separate, longer threshold auto-applied to battery-powered Zigbee devices (they check in less often); disabled by default
    • **Mass outage detection** – When many devices drop together (a Zigbee coordinator / MQTT bridge / hub failure), send one aggregated alert instead of a per-device flood, suppress per-device handling until recovery, run an optional one-time remediation action, and report recovery in two phases so slow battery devices don't cause a second flood; disabled by default
    • **Duplicate notification protection** – Each device notified only once per offline event
    • **Tracking-helper overflow warning** – Persistent notification when the 255-character helper limit is hit and devices can no longer be tracked
    • **Clamped-threshold warning** – Persistent notification when an offline threshold is shorter than the Check Interval and is therefore silently treated as one interval
    • **Multiple device notifications** – Send alerts to multiple phones/tablets simultaneously
    • **Platform-aware notifications** – Separate iOS and Android notification options
    • **Notification timestamp** – Optional time-of-day with seconds on every alert (iOS subtitle / Android subject); 12H or 24H
    • **Customizable notification text** – Override the offline/online notification title and message with your own templates
    • **iOS interruption level control** – Configure offline and online alert urgency independently
    • **iOS notification grouping** – Consolidates alerts into a single grouped notification
    • **Android high priority delivery** – Ensure offline alerts are delivered immediately
    • **Android sticky notifications** – Keep offline alerts visible until manually dismissed
    • **Android notification channels** – Route alerts to a dedicated channel with custom sound and importance
    • **Flexible notification options** – Enable/disable offline and online notifications independently
    • **Custom actions support** – Run scripts, webhooks, Telegram/Discord messages alongside or instead of Companion App notifications
    • **Configurable check interval** – Run the periodic offline scan every 5, 10, 15, or 30 minutes
    • **Automatic recovery handling** – Tracks when devices come back online and clears from notification queue
    • **Self-healing tracking list** – The periodic scan clears devices that recovered while their online event was missed (e.g. an HA restart), so future alerts keep working
    • **Device exclusion list** – Exclude specific entities from monitoring
    • **Rich context variables** – Pass device details, timestamps, and durations to custom actions
    </details>

    <details><summary>Requirements</summary>

    • Home Assistant 2026.3.0 or newer (the offline-duration inputs use the hours/minutes duration picker)
    • [MQTT Connection State integration](https://github.com/studioIngrid/mqtt_connection_state) (installed separately via HACS)
    • One Input Text helper with maximum length of 255 characters (for tracking notified devices)
    </details>

    <details><summary>Upgrading from v0.2.0 or earlier</summary>

    **Breaking change:** "Offline Duration" is now an hours/minutes picker instead of a
    raw minute count. After updating the blueprint, open the automation and re-enter
    the offline duration (e.g. 3 h 0 min for the old default of 180). Existing
    automations keep working but will show the threshold as empty until re-saved.
    </details>

    <details><summary>Known Limitation</summary>

    Due to the 255-character limit of Input Text helpers, approximately **10-15 devices**
    can be tracked simultaneously depending on the length of device names. Beyond that
    the helper is truncated and a persistent notification is raised (see *Warn When
    Tracking Helper Is Full*). Enabling **Mass Outage Detection** removes this ceiling
    for coordinator/bridge-wide outages, because those are then tracked as a single
    marker instead of a per-device list. For very large deployments of independent
    devices, consider splitting into multiple blueprints with separate helpers.

    Additionally, offline detection runs on a periodic polling cycle (**Check Interval**,
    default 15 minutes), so actual detection may occur up to one interval after the
    configured threshold is reached.
    </details>
  domain: automation
  source_url: https://github.com/dabo53ck/mqtt-connection-state-monitor

  input:
    notifications:
      name: Notifications
      icon: mdi:bell
      collapsed: true
      input:
        offline_notifications_enabled:
          name: Enable Offline Notifications
          description: >-
            Send a Companion App notification when a device has been
            offline longer than the configured duration.
          default: true
          selector:
            boolean: {}
        online_notifications_enabled:
          name: Enable Online Notifications
          description: >-
            Send a Companion App notification when a previously tracked
            offline device comes back online.
          default: true
          selector:
            boolean: {}
        notification_timestamp_enabled:
          name: Include Timestamp in Notifications
          description: >-
            Adds the current time (with seconds) to each Companion App
            notification. Shown as the subtitle on iOS and as the subject
            line on Android. Does not change the title or message.
          default: true
          selector:
            boolean: {}
        notification_time_format:
          name: Timestamp Format
          description: >-
            Clock format for the notification timestamp.
          default: "24h"
          selector:
            select:
              mode: dropdown
              options:
                - label: 24-hour (14:23:15)
                  value: "24h"
                - label: 12-hour (02:23:15 PM)
                  value: "12h"
              custom_value: false
              multiple: false
              sort: false
        notification_devices:
          name: Notification Devices
          description: >-
            Target devices for Companion App notifications.
            Select one or more mobile devices with the Home Assistant Companion App installed.
            For other targets (Alexa, Telegram, SMTP, etc.), use the Custom Actions section.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        offline_title:
          name: Offline Notification Title
          description: >-
            Title line for the offline Companion App notification. May contain
            templates using the context variables friendly_name, device_name,
            entity_id, offline_seconds and notification_time. Leave as default
            for the built-in wording.
          default: "🔴 {{ friendly_name }} offline"
          selector:
            text: {}
        offline_message:
          name: Offline Notification Message
          description: >-
            Body text for the offline Companion App notification. Supports the
            same context variables as the title.
          default: >-
            {{ friendly_name }} has been offline for
            {{ (offline_seconds / 60) | round(0) }} minutes.
          selector:
            text:
              multiline: true
        online_title:
          name: Online Notification Title
          description: >-
            Title line for the recovery (back online) Companion App
            notification. May use friendly_name, device_name, entity_id and
            notification_time.
          default: "🟢 {{ friendly_name }} online"
          selector:
            text: {}
        online_message:
          name: Online Notification Message
          description: >-
            Body text for the recovery Companion App notification. Supports the
            same context variables as the title.
          default: "{{ friendly_name }} is back online."
          selector:
            text:
              multiline: true

    ios_notification_options:
      name: iOS Notification Options
      icon: mdi:apple
      collapsed: true
      input:
        offline_interruption_level:
          name: Offline Interruption Level
          description: >-
            On iOS 15 and later, configure how offline notifications are delivered.
            Critical and time-sensitive notifications must be enabled in the Home Assistant app
            and allowed in Focus settings.
          default: time-sensitive
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: active
                - label: Critical Notifications
                  value: critical
                - label: Time Sensitive Notifications
                  value: time-sensitive
                - label: Quiet Notifications Without Waking Screen
                  value: passive
              custom_value: false
              multiple: false
              sort: false
        online_interruption_level:
          name: Online Interruption Level
          description: >-
            On iOS 15 and later, configure how online recovery notifications are delivered.
          default: passive
          selector:
            select:
              mode: dropdown
              options:
                - label: Default
                  value: active
                - label: Critical Notifications
                  value: critical
                - label: Time Sensitive Notifications
                  value: time-sensitive
                - label: Quiet Notifications Without Waking Screen
                  value: passive
              custom_value: false
              multiple: false
              sort: false
        ios_notification_group:
          name: Notification Group
          description: >-
            Groups all MQTT connection notifications together on iOS
            so they don't clutter your notification center.
          default: mqtt_connection_state
          selector:
            text: {}

    android_notification_options:
      name: Android Notification Options
      icon: mdi:robot
      collapsed: true
      input:
        offline_high_priority:
          name: High Priority (Offline)
          description: >-
            Delivers offline alerts immediately, bypassing normal delivery delays.
          default: true
          selector:
            boolean: {}
        offline_sticky:
          name: Sticky Notification (Offline)
          description: >-
            Offline alerts remain in the notification shade until manually dismissed.
          default: true
          selector:
            boolean: {}
        online_high_priority:
          name: High Priority (Online)
          description: >-
            Delivers online recovery alerts immediately.
          default: false
          selector:
            boolean: {}
        online_sticky:
          name: Sticky Notification (Online)
          description: >-
            Online alerts remain in the notification shade until manually dismissed.
          default: false
          selector:
            boolean: {}
        android_notification_channel:
          name: Notification Channel
          description: >-
            Notification channel for Android devices.
            A new channel will be created on first notification if it doesn't exist.
            Customize sound, vibration, and importance in your device settings after creation.
          default: MQTT Alerts
          selector:
            text: {}

    actions:
      name: Custom Actions
      icon: mdi:lightning-bolt
      collapsed: true
      input:
        offline_actions:
          name: Offline Actions
          description: >-
            Optional actions executed when a device goes offline.
            Available variables:
            • device_name
            • friendly_name
            • entity_id
            • offline_seconds
            • threshold_seconds (effective value for this device)
            • battery_powered (true if matched as a battery device)
            • offline_time
            • offline_timestamp
            • notification_time

            Examples:
            Telegram: Device {{ friendly_name }} is offline.
            Persistent Notification: {{ friendly_name }} has been offline for {{ offline_seconds }} seconds.
            Script: Pass {{ entity_id }} to another script.
          default: []
          selector:
            action: {}
        online_actions:
          name: Online Actions
          description: >-
            Optional actions executed when a device comes back online.
            Available variables:
            • device_name
            • friendly_name
            • entity_id
            • online_time
            • online_timestamp
            • notification_time

            Examples:
            Telegram: Device {{ friendly_name }} is back online.
            Script: Pass {{ entity_id }} to another script.
          default: []
          selector:
            action: {}

    mass_outage_options:
      name: Mass Outage Detection
      icon: mdi:lan-disconnect
      collapsed: true
      input:
        mass_outage_detection:
          name: Enable Mass Outage Detection
          description: >-
            When many monitored devices go offline together — a Zigbee
            coordinator, MQTT bridge or hub failure rather than genuine
            per-device outages — send one aggregated alert instead of a
            per-device flood, suppress all per-device offline/online handling
            until recovery, and optionally run a one-time remediation action.
            Requires at least one of Trigger Count, Trigger Fraction or
            Bridge / Coordinator Entities to be set, otherwise it stays inert.
          default: false
          selector:
            boolean: {}
        mass_outage_count:
          name: Trigger Count
          description: >-
            Declare a mass outage when at least this many monitored devices are
            offline in a single check. 0 disables this criterion.
          default: 0
          selector:
            number:
              min: 0
              max: 1000
              mode: box
        mass_outage_fraction:
          name: Trigger Fraction (%)
          description: >-
            Declare a mass outage when at least this percentage of all monitored
            devices is offline in a single check. Combined with Trigger Count
            using OR. 0 disables this criterion.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              mode: slider
        bridge_entities:
          name: Bridge / Coordinator Entities
          description: >-
            Optional. Connectivity entities for your Zigbee bridge / MQTT broker
            / hub. If any of these is 'off' or 'unavailable', a mass outage is
            declared immediately (no two-scan debounce). They are also the
            primary "infrastructure recovered" signal, but recovery is only
            declared once they are ALL back 'on' AND the devices are visibly
            reconnecting (at least half of mains devices back, or the offline
            count down to 80% of its peak) — the bridge entity alone is not
            enough. If the outage re-expands or a bridge entity trips again
            after a declared recovery, the episode reopens (up to twice) and
            re-runs the remediation action. Point these at something that
            reflects coordinator health, not just broker connectivity.
          default: []
          selector:
            entity:
              multiple: true
        mass_outage_reminder_hours:
          name: Reminder Interval (hours)
          description: >-
            While the infrastructure is still down, repeat the mass outage alert
            roughly every N hours. 0 disables reminders. Reminders stop once the
            infrastructure recovers.
          default: 2
          selector:
            number:
              min: 0
              max: 48
              mode: box
        mass_outage_actions:
          name: Mass Outage Actions
          description: >-
            Optional actions run ONCE per mass outage, after Action Delay, and
            only if the outage is still ongoing. Typical use: press the
            coordinator's restart button. Available variables: offline_count,
            monitored_count, offline_fraction, affected_devices, outage_started,
            trigger_reason, bridge_entity.
          default: []
          selector:
            action: {}
        mass_outage_action_delay:
          name: Action Delay
          description: >-
            Wait this long after a mass outage is detected before running Mass
            Outage Actions; the action runs only if the outage is still ongoing.
          default:
            hours: 0
            minutes: 10
          selector:
            duration:
              enable_second: false
        battery_recovery_grace:
          name: Battery Recovery Grace
          description: >-
            After the infrastructure recovers, how long battery-powered devices
            are allowed to take to re-announce before being reported as "not
            recovered". Mains devices use twice the Check Interval.
          default:
            hours: 1
            minutes: 0
          selector:
            duration:
              enable_second: false
        mass_outage_max_hours:
          name: Maximum Outage Duration (hours)
          description: >-
            Safety cap. Force-close the mass outage episode after this many
            hours; any devices still offline then fall back to normal per-device
            tracking.
          default: 24
          selector:
            number:
              min: 1
              max: 168
              mode: box
        mass_outage_title:
          name: Mass Outage Notification Title
          description: >-
            Title for the aggregated mass outage alert and its reminders.
            Context variables: offline_count, monitored_count, offline_fraction,
            affected_devices, outage_started, outage_duration, trigger_reason,
            bridge_entity, is_reminder, notification_time.
          default: "🚨 Mass outage: {{ offline_count }} devices offline"
          selector:
            text: {}
        mass_outage_message:
          name: Mass Outage Notification Message
          description: >-
            Body for the aggregated mass outage alert / reminder. Same context
            variables as the title.
          default: >-
            {{ offline_count }} of {{ monitored_count }} monitored devices went
            offline together{% if is_reminder %}, {{ (outage_duration / 3600) |
            round(1) }} h ago, and are still offline{% endif %}. Likely a
            coordinator or bridge failure (trigger: {{ trigger_reason }}).
          selector:
            text:
              multiline: true
        mass_recovery_title:
          name: Mass Recovery Notification Title
          description: >-
            Title for the "infrastructure recovered" alert. Context variables:
            recovered_count, monitored_count, still_offline_count,
            outage_duration, outage_started, notification_time.
          default: "✅ Mass outage cleared"
          selector:
            text: {}
        mass_recovery_message:
          name: Mass Recovery Notification Message
          description: >-
            Body for the "infrastructure recovered" alert. Same context
            variables as the title.
          default: >-
            {{ recovered_count }} of {{ monitored_count }} devices are back
            online.{% if still_offline_count %} {{ still_offline_count }} still
            pending — battery devices may take a while.{% endif %}
          selector:
            text:
              multiline: true
        mass_followup_title:
          name: Not-Recovered Follow-up Title
          description: >-
            Title for the follow-up that lists devices which did NOT come back
            after a mass outage. Sent separately for mains and battery devices.
            Context variables: followup_kind ('mains' or 'battery'),
            still_offline_devices, still_offline_count, outage_started,
            notification_time.
          default: "⚠️ {{ still_offline_count }} {{ followup_kind }} device(s) did not recover"
          selector:
            text: {}
        mass_followup_message:
          name: Not-Recovered Follow-up Message
          description: >-
            Body for the not-recovered follow-up. Same context variables as the
            title.
          default: >-
            After the mass outage these {{ followup_kind }} devices are still
            offline: {{ still_offline_devices | join(', ') }}.
          selector:
            text:
              multiline: true

    monitoring_options:
      name: Monitoring Options
      icon: mdi:cog-transfer-outline
      collapsed: true
      input:
        check_interval_minutes:
          name: Check Interval
          description: >-
            How often the periodic offline check runs. A shorter interval detects
            outages sooner; a longer interval evaluates the monitoring templates
            less often, which is lighter on large or constrained instances. This
            is also the minimum effective offline threshold — an Offline Duration
            (or Battery Device Offline Duration) shorter than one interval is
            treated as one interval.
          default: "15"
          selector:
            select:
              mode: dropdown
              options:
                - label: Every 5 minutes
                  value: "5"
                - label: Every 10 minutes
                  value: "10"
                - label: Every 15 minutes
                  value: "15"
                - label: Every 30 minutes
                  value: "30"
              custom_value: false
              multiple: false
              sort: false
        offline_duration:
          name: Offline Duration
          description: >-
            Time a device must remain offline before notifications and actions are
            executed. Detection is bound to the periodic check (see Check
            Interval), so actual detection may occur up to one interval after this
            threshold is reached; a value shorter than one interval is treated as
            one interval.
          default:
            hours: 3
            minutes: 0
          selector:
            duration:
              enable_second: false
        battery_offline_duration:
          name: Battery Device Offline Duration
          description: >-
            Separate offline threshold for battery-powered Zigbee devices. Any
            monitored device that also exposes a battery entity (battery percent
            sensor or Low/OK binary sensor) is auto-detected and uses this threshold
            instead of the one above, because sleepy battery devices check in far
            less often. Leave at 0 h 0 min to disable — all devices then use the
            Offline Duration above.
          default:
            hours: 0
            minutes: 0
          selector:
            duration:
              enable_second: false
        self_heal_notify:
          name: Notify on Self-Healed Recovery
          description: >-
            If a device's "back online" event is missed (for example, Home
            Assistant restarted while it was recovering), the periodic check still
            removes it from the tracking helper so future offline alerts work
            again. With this enabled, that self-healed recovery also sends the
            normal online notification and runs the Online Actions, exactly like a
            live recovery. Disable to heal the tracking list silently.
          default: true
          selector:
            boolean: {}
        warn_on_clamped_threshold:
          name: Warn When Threshold Is Clamped
          description: >-
            Raise a persistent notification when Offline Duration or Battery
            Device Offline Duration is shorter than the Check Interval and is
            therefore silently treated as one interval. Dismisses itself when the
            values are no longer clamped.
          default: true
          selector:
            boolean: {}
        warn_on_helper_full:
          name: Warn When Tracking Helper Is Full
          description: >-
            Raise a persistent notification when the tracking helper hits the
            255-character limit and devices can no longer be tracked (duplicate
            offline alerts become likely). Independent of Mass Outage Detection.
          default: true
          selector:
            boolean: {}
        exclude_entities:
          name: Exclude Devices
          description: >-
            Select devices that should be excluded from monitoring.
            Shows binary_sensors with device_class 'connectivity'.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
                device_class: connectivity
        notified_helper:
          name: Notification Tracking Helper
          description: >-
            Input Text helper used internally to prevent duplicate
            offline notifications. Create one Input Text helper with
            **maximum length of 255**.
            [Click here to create it](https://my.home-assistant.io/redirect/config_flow_start/?domain=input_text).
            Need help? See the
            [Setup Instructions](https://github.com/dabo53ck/mqtt-connection-state-monitor#setup-instructions).
          selector:
            entity:
              domain: input_text

mode: queued
max: 10
max_exceeded: warning

# time_pattern does not render templates in its own options, so the interval
# cannot be a single templated trigger. Instead, one fixed trigger per allowed
# interval, switched on by `enabled` (a limited template over the trigger
# variable, evaluated once at load).
trigger_variables:
  check_interval_minutes: !input check_interval_minutes

trigger:
  - platform: time_pattern
    minutes: "/5"
    enabled: "{{ check_interval_minutes | string == '5' }}"
  - platform: time_pattern
    minutes: "/10"
    enabled: "{{ check_interval_minutes | string == '10' }}"
  - platform: time_pattern
    minutes: "/15"
    enabled: "{{ check_interval_minutes | string == '15' }}"
  - platform: time_pattern
    minutes: "/30"
    enabled: "{{ check_interval_minutes | string == '30' }}"
  - platform: event
    event_type: mqtt_connection_state_changed

variables:
  offline_notifications_enabled: !input offline_notifications_enabled
  online_notifications_enabled: !input online_notifications_enabled
  notification_timestamp_enabled: !input notification_timestamp_enabled
  notification_time_format: !input notification_time_format
  notification_devices: !input notification_devices
  notified_helper: !input notified_helper
  exclude_entities: !input exclude_entities
  check_interval_minutes: !input check_interval_minutes
  self_heal_notify: !input self_heal_notify
  offline_duration: !input offline_duration
  battery_offline_duration: !input battery_offline_duration
  offline_interruption_level: !input offline_interruption_level
  online_interruption_level: !input online_interruption_level
  ios_notification_group: !input ios_notification_group
  offline_high_priority: !input offline_high_priority
  offline_sticky: !input offline_sticky
  online_high_priority: !input online_high_priority
  online_sticky: !input online_sticky
  android_notification_channel: !input android_notification_channel
  warn_on_clamped_threshold: !input warn_on_clamped_threshold
  warn_on_helper_full: !input warn_on_helper_full
  mass_outage_detection: !input mass_outage_detection
  mass_outage_count: !input mass_outage_count
  mass_outage_fraction: !input mass_outage_fraction
  bridge_entities: !input bridge_entities
  mass_outage_reminder_hours: !input mass_outage_reminder_hours
  mass_outage_actions: !input mass_outage_actions
  mass_outage_action_delay: !input mass_outage_action_delay
  battery_recovery_grace: !input battery_recovery_grace
  mass_outage_max_hours: !input mass_outage_max_hours
  offline_duration_seconds: "{{ (offline_duration.hours | int(0)) * 3600 + (offline_duration.minutes | int(0)) * 60 }}"
  battery_offline_duration_seconds: "{{ (battery_offline_duration.hours | int(0)) * 3600 + (battery_offline_duration.minutes | int(0)) * 60 }}"
  check_interval_seconds: "{{ (check_interval_minutes | int(15)) * 60 }}"
  threshold_seconds: "{{ [offline_duration_seconds | int(0), check_interval_seconds | int(900)] | max }}"
  battery_threshold_seconds: "{{ 0 if (battery_offline_duration_seconds | int(0)) == 0 else [battery_offline_duration_seconds | int(0), check_interval_seconds | int(900)] | max }}"
  mass_outage_action_delay_seconds: "{{ (mass_outage_action_delay.hours | int(0)) * 3600 + (mass_outage_action_delay.minutes | int(0)) * 60 }}"
  battery_recovery_grace_seconds: "{{ (battery_recovery_grace.hours | int(0)) * 3600 + (battery_recovery_grace.minutes | int(0)) * 60 }}"
  mass_outage_enabled: >-
    {{ (mass_outage_detection | default(false) | bool(false))
       and (((mass_outage_count | int(0)) > 0)
            or ((mass_outage_fraction | int(0)) > 0)
            or ((bridge_entities | default([]) | length) > 0)) }}
  threshold_clamped: "{{ (offline_duration_seconds | int(0)) > 0 and (offline_duration_seconds | int(0)) < (check_interval_seconds | int(900)) }}"
  battery_threshold_clamped: "{{ (battery_offline_duration_seconds | int(0)) > 0 and (battery_offline_duration_seconds | int(0)) < (check_interval_seconds | int(900)) }}"
  timestamp_format: "{{ '%I:%M:%S %p' if notification_time_format == '12h' else '%H:%M:%S' }}"
  offline_message_data: >-
    {% set msg = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% set push.data = dict(push.data, **{'interruption-level': offline_interruption_level}) %}
    {% if push.data %}
      {% set msg.data = dict(msg.data, **{'push': push.data}) %}
    {% endif %}
    {% if ios_notification_group %}
      {% set msg.data = dict(msg.data, **{'group': ios_notification_group}) %}
    {% endif %}
    {% if offline_high_priority %}
      {% set msg.data = dict(msg.data, **{'ttl': 0, 'priority': 'high'}) %}
    {% endif %}
    {% if offline_sticky %}
      {% set msg.data = dict(msg.data, **{'sticky': 'true'}) %}
    {% endif %}
    {% if android_notification_channel %}
      {% set msg.data = dict(msg.data, **{'channel': android_notification_channel}) %}
    {% endif %}
    {{ msg.data }}
  online_message_data: >-
    {% set msg = namespace(data={}) %}
    {% set push = namespace(data={}) %}
    {% set push.data = dict(push.data, **{'interruption-level': online_interruption_level}) %}
    {% if push.data %}
      {% set msg.data = dict(msg.data, **{'push': push.data}) %}
    {% endif %}
    {% if ios_notification_group %}
      {% set msg.data = dict(msg.data, **{'group': ios_notification_group}) %}
    {% endif %}
    {% if online_high_priority %}
      {% set msg.data = dict(msg.data, **{'ttl': 0, 'priority': 'high'}) %}
    {% endif %}
    {% if online_sticky %}
      {% set msg.data = dict(msg.data, **{'sticky': 'true'}) %}
    {% endif %}
    {% if android_notification_channel %}
      {% set msg.data = dict(msg.data, **{'channel': android_notification_channel}) %}
    {% endif %}
    {{ msg.data }}

action:
  - choose:
      # ============================================================
      # DEVICE BACK ONLINE (event-triggered)
      # Entire sequence (helper update, notification, actions) is
      # gated behind "device_name in current_notified" — if the
      # device was never tracked as offline, nothing fires.
      # While a mass outage episode is active the event branch is a
      # no-op: recovery is handled by the periodic scan so recovery
      # event storms do not produce a per-device push flood.
      # ============================================================
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.platform == 'event' and trigger.event.data.state == 'online' }}
        sequence:
          - variables:
              entity_id: "{{ trigger.event.data.entity_id }}"
              device_name: >-
                {{ trigger.event.data.entity_id
                   | replace('binary_sensor.', '')
                   | replace('_connection_state', '') }}
              helper_raw_list: >-
                {% set raw = states(notified_helper) %}
                {% if raw in ['', 'unknown', 'unavailable'] %}
                {{ [] }}
                {% else %}
                {{ raw.split('|') }}
                {% endif %}
          - variables:
              mass_raw: >-
                {{ helper_raw_list[0]
                   if (helper_raw_list | length > 0 and helper_raw_list[0].startswith('__mass'))
                   else '' }}
          - variables:
              current_notified: >-
                {{ helper_raw_list[1:] if (mass_raw | length > 0) else helper_raw_list }}
          - if:
              - condition: template
                value_template: >-
                  {{ (mass_raw | length == 0) and (device_name in current_notified) }}
            then:
              # 1. Remove device from helper
              - variables:
                  updated_list: >-
                    {{ (current_notified | reject('eq', device_name) | list) | join('|') }}
              - action: input_text.set_value
                target:
                  entity_id: !input notified_helper
                data:
                  value: "{{ updated_list }}"
              # 2. Set friendly_name, timestamps
              - variables:
                  friendly_name: >-
                    {{ state_attr(trigger.event.data.entity_id, 'friendly_name')
                       | default(device_name | replace('_', ' ') | title, true) }}
                  online_timestamp: "{{ now() }}"
                  online_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  notification_time: "{{ now().strftime(timestamp_format) }}"
                  online_notification_data: >-
                    {{ dict(online_message_data,
                       **{'subtitle': notification_time, 'subject': notification_time})
                       if notification_timestamp_enabled else online_message_data }}
              # 3. Send notification (if enabled)
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ online_notifications_enabled and notification_devices | length > 0 }}
                    sequence:
                      - repeat:
                          for_each: "{{ notification_devices | list }}"
                          sequence:
                            - action: >-
                                notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                              data:
                                title: !input online_title
                                message: !input online_message
                                data: "{{ online_notification_data }}"
              # 4. Run online actions
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ true }}"
                    sequence: !input online_actions

      # ============================================================
      # PERIODIC OFFLINE CHECK (time_pattern-triggered)
      # ============================================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform != 'event' }}"
        sequence:
          # ---- Parse the tracking helper: an optional mass-outage
          # ---- marker ("__mass__:..." or "__mass_pending__:...") in the
          # ---- first field, then the pipe-delimited device names.
          - variables:
              helper_raw_list: >-
                {% set raw = states(notified_helper) %}
                {% if raw in ['', 'unknown', 'unavailable'] %}
                {{ [] }}
                {% else %}
                {{ raw.split('|') }}
                {% endif %}
          - variables:
              mass_raw: >-
                {{ helper_raw_list[0]
                   if (helper_raw_list | length > 0 and helper_raw_list[0].startswith('__mass'))
                   else '' }}
          - variables:
              current_notified: >-
                {{ helper_raw_list[1:] if (mass_raw | length > 0) else helper_raw_list }}
              mass_state: >-
                {% set p = mass_raw.split(':') %}
                {% if p[0] == '__mass__' and (p | length) >= 6 %}
                {{ {'phase': 'active', 'detected': p[1] | int(0), 'infra': p[2] | int(0),
                    'action_fired': (p[3] == '1'), 'mains_fu': (p[4] == '1'), 'batt_fu': (p[5] == '1'),
                    'peak': (p[6] | int(0) if (p | length) >= 7 else 0),
                    'reopen': (p[7] | int(0) if (p | length) >= 8 else 0)} }}
                {% elif p[0] == '__mass_pending__' and (p | length) >= 2 %}
                {{ {'phase': 'pending', 'first_seen': p[1] | int(0)} }}
                {% else %}
                {{ {'phase': 'none'} }}
                {% endif %}
          # ---- Optional warning: an offline threshold shorter than the
          # ---- Check Interval is silently clamped up to one interval.
          - if:
              - condition: template
                value_template: "{{ warn_on_clamped_threshold | bool(true) }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ threshold_clamped or battery_threshold_clamped }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: mqtt_csm_threshold_clamped
                      title: MQTT Connection State Monitor
                      message: >-
                        {% set ci = (check_interval_seconds | int(900)) // 60 -%}
                        {%- if threshold_clamped %}Offline Duration
                        ({{ (offline_duration_seconds | int(0)) // 60 }} min) is shorter than the
                        Check Interval ({{ ci }} min) and is treated as {{ ci }} min.{% endif -%}
                        {%- if battery_threshold_clamped %} Battery Device Offline Duration
                        ({{ (battery_offline_duration_seconds | int(0)) // 60 }} min) is likewise
                        treated as {{ ci }} min — set it above the Check Interval for the separate
                        battery threshold to have any effect.{% endif %}
                else:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: mqtt_csm_threshold_clamped
          # ---- Device IDs and registry identifier strings of every device
          # ---- that exposes a device_class: battery entity. Used ONLY as a
          # ---- membership set to classify a monitored connectivity device
          # ---- as battery-powered. Needed whenever the battery threshold OR
          # ---- mass outage detection is active (the latter splits mains vs
          # ---- battery devices for recovery).
          - variables:
              battery_device_idents: >-
                {% if (battery_threshold_seconds | int(0)) == 0 and not (mass_outage_enabled | bool(false)) %}
                {{ [] }}
                {% else %}
                {% set bns = namespace(ids=[]) %}
                {% for s in (states.sensor
                       | selectattr('attributes.device_class', 'defined')
                       | selectattr('attributes.device_class', 'eq', 'battery')
                       | list)
                     + (states.binary_sensor
                       | selectattr('attributes.device_class', 'defined')
                       | selectattr('attributes.device_class', 'eq', 'battery')
                       | list) %}
                  {% set d = device_id(s.entity_id) %}
                  {% if d %}
                    {% set bns.ids = bns.ids + [d] %}
                    {% for ident in device_attr(d, 'identifiers') or [] %}
                      {% set bns.ids = bns.ids + [ident | join(':')] %}
                    {% endfor %}
                  {% endif %}
                {% endfor %}
                {{ bns.ids | unique | list }}
                {% endif %}
          # ---- Single scan of every monitored connectivity sensor. All
          # ---- downstream logic (due devices, recovered devices, mass
          # ---- outage detection) derives from this list.
          - variables:
              monitored: >-
                {% set ns = namespace(items=[]) %}
                {% set nowts = as_timestamp(now()) | int %}
                {% for st in states.binary_sensor
                     | selectattr('entity_id', 'search', 'connection_state$')
                     | rejectattr('entity_id', 'in', exclude_entities)
                     | list %}
                  {% set dname = st.entity_id
                       | replace('binary_sensor.', '')
                       | replace('_connection_state', '') %}
                  {% set lc = st.last_changed %}
                  {% set lcts = (as_timestamp(lc) | int) if lc else 0 %}
                  {% set osec = (nowts - lcts) if lcts else 0 %}
                  {% set cd = device_id(st.entity_id) %}
                  {% set ck = namespace(ids=[]) %}
                  {% if cd %}
                    {% set ck.ids = ck.ids + [cd] %}
                    {% for ident in device_attr(cd, 'identifiers') or [] %}
                      {% set ck.ids = ck.ids + [ident | join(':')] %}
                    {% endfor %}
                  {% endif %}
                  {% set is_batt = ck.ids | select('in', battery_device_idents) | list | length > 0 %}
                  {% set fname = state_attr(st.entity_id, 'friendly_name')
                       | default(dname | replace('_', ' ') | title, true) %}
                  {% set ns.items = ns.items + [{
                       'entity_id': st.entity_id, 'device_name': dname, 'friendly_name': fname,
                       'state': st.state, 'offline_seconds': osec, 'lc_ts': lcts, 'is_batt': is_batt}] %}
                {% endfor %}
                {{ ns.items }}
          # ---- Mass-outage state machine. Produces a single dict describing
          # ---- what (if anything) should happen this run and the tracking-
          # ---- helper marker to write. A no-op when mass detection is off.
          - variables:
              mass: >-
                {% set nowts = as_timestamp(now()) | int %}
                {% set ci = check_interval_seconds | int(900) %}
                {% set moff = monitored | selectattr('state', 'eq', 'off') | list %}
                {% set mon_ct = monitored | length %}
                {% set off_ct = moff | length %}
                {% set mains = monitored | rejectattr('is_batt') | list %}
                {% set mains_ct = mains | length %}
                {% set mains_on = mains | selectattr('state', 'eq', 'on') | list | length %}
                {% set frac = (100.0 * off_ct / mon_ct) if mon_ct > 0 else 0 %}
                {% set be = bridge_entities | default([]) %}
                {% set bb = namespace(bad=[], all_on=true) %}
                {% for e in be %}
                  {% if states(e) in ['off', 'unavailable'] %}{% set bb.bad = bb.bad + [e] %}{% endif %}
                  {% if states(e) != 'on' %}{% set bb.all_on = false %}{% endif %}
                {% endfor %}
                {% set bridge_tripped = (be | length > 0) and (bb.bad | length > 0) %}
                {% set bridge_all_on = (be | length > 0) and bb.all_on %}
                {% set cnt_hit = (mass_outage_count | int(0)) > 0 and off_ct >= (mass_outage_count | int(0)) %}
                {% set frac_hit = (mass_outage_fraction | int(0)) > 0 and frac >= (mass_outage_fraction | int(0)) %}
                {% set cond = (mass_outage_enabled | bool(false)) and (cnt_hit or frac_hit or bridge_tripped) %}
                {% set reason = 'bridge' if bridge_tripped else ('count' if cnt_hit else ('fraction' if frac_hit else 'none')) %}
                {% set sp = mass_state.phase %}
                {% set ns = namespace(action='none', sentinel=mass_raw, notify='none',
                                      run_remediation=false, suppress_all=false, suppress_members=false,
                                      detected=0, infra=0, still=[], still_kind='') %}
                {% if not (mass_outage_enabled | bool(false)) %}
                {% elif sp == 'none' %}
                  {% if cond and bridge_tripped %}
                    {% set ns.action = 'promote' %}
                    {% set ns.sentinel = '__mass__:' ~ nowts ~ ':0:0:0:0:' ~ off_ct ~ ':0' %}
                    {% set ns.notify = 'outage' %}
                    {% set ns.detected = nowts %}
                    {% set ns.suppress_all = true %}
                  {% elif cond %}
                    {% set ns.action = 'start_pending' %}
                    {% set ns.sentinel = '__mass_pending__:' ~ nowts %}
                    {% set ns.suppress_all = true %}
                  {% endif %}
                {% elif sp == 'pending' %}
                  {% if cond and (bridge_tripped or (nowts - mass_state.first_seen) >= ci) %}
                    {% set ns.action = 'promote' %}
                    {% set ns.sentinel = '__mass__:' ~ nowts ~ ':0:0:0:0:' ~ off_ct ~ ':0' %}
                    {% set ns.notify = 'outage' %}
                    {% set ns.detected = nowts %}
                    {% set ns.suppress_all = true %}
                  {% elif cond %}
                    {% set ns.suppress_all = true %}
                  {% else %}
                    {% set ns.action = 'clear_pending' %}
                    {% set ns.sentinel = '' %}
                  {% endif %}
                {% elif sp == 'active' %}
                  {% set d = mass_state.detected %}
                  {% set inf = mass_state.infra %}
                  {% set af = 1 if mass_state.action_fired else 0 %}
                  {% set mfu = 1 if mass_state.mains_fu else 0 %}
                  {% set bfu = 1 if mass_state.batt_fu else 0 %}
                  {% set reopen_n = mass_state.get('reopen', 0) | int(0) %}
                  {% set peak_prev = mass_state.get('peak', 0) | int(0) %}
                  {% set peak_now = [peak_prev, off_ct, mass_outage_count | int(0)] | max %}
                  {% set reopen_cap = 2 %}
                  {% set max_secs = (mass_outage_max_hours | int(24)) * 3600 %}
                  {% set ns.detected = d %}
                  {# infra counts as recovered only WITH corroborating device
                     recovery, never on the bridge sensor alone. mains_ratio_ok
                     (no bridge configured) keeps its original meaning. #}
                  {% set mains_ratio = (mains_on / mains_ct) if mains_ct > 0 else 0 %}
                  {% set mains_ratio_ok = mains_ratio >= 0.9 %}
                  {% set recovering = mains_ratio >= 0.5 or off_ct <= (peak_now * 4 // 5) %}
                  {% set infra_ok = (bridge_all_on and recovering) or mains_ratio_ok %}
                  {% if inf == 0 %}
                    {% set ns.suppress_all = true %}
                    {% if af == 0 and (mass_outage_actions | default([]) | length) > 0
                            and (nowts - d) >= (mass_outage_action_delay_seconds | int(0))
                            and cond and not infra_ok %}
                      {% set ns.action = 'run_remediation' %}
                      {% set ns.run_remediation = true %}
                      {% set ns.sentinel = '__mass__:' ~ d ~ ':0:1:0:0:' ~ peak_now ~ ':' ~ reopen_n %}
                    {% elif infra_ok %}
                      {% set ns.action = 'infra_recovered' %}
                      {% set ns.infra = nowts %}
                      {% set ns.sentinel = '__mass__:' ~ d ~ ':' ~ nowts ~ ':' ~ af ~ ':0:0:' ~ peak_now ~ ':' ~ reopen_n %}
                      {% set ns.notify = 'recovery' %}
                    {% elif (mass_outage_reminder_hours | int(0)) > 0
                            and (nowts - d) >= (mass_outage_reminder_hours | int(0)) * 3600
                            and ((nowts - d) % ((mass_outage_reminder_hours | int(0)) * 3600)) < ci %}
                      {% set ns.action = 'reminder' %}
                      {% set ns.notify = 'reminder' %}
                    {% elif peak_now > peak_prev %}
                      {% set ns.sentinel = '__mass__:' ~ d ~ ':0:' ~ af ~ ':0:0:' ~ peak_now ~ ':' ~ reopen_n %}
                    {% endif %}
                  {% else %}
                    {% set outage_reexpanded = cond and off_ct >= (mass_outage_count | int(1))
                         and off_ct >= (peak_now * 4 // 5) %}
                    {% if (bridge_tripped or outage_reexpanded)
                          and reopen_n < reopen_cap and (nowts - d) < max_secs %}
                      {# recovery was premature — drop back to the infra-down
                         phase, re-arm remediation and reminders, bounded to
                         reopen_cap so it cannot ping-pong forever. #}
                      {% set ns.action = 'reopen' %}
                      {% set ns.infra = 0 %}
                      {% set ns.suppress_all = true %}
                      {% set ns.notify = 'reminder' %}
                      {% set ns.sentinel = '__mass__:' ~ d ~ ':0:0:0:0:' ~ peak_now ~ ':' ~ (reopen_n + 1) %}
                    {% else %}
                      {% set ns.infra = inf %}
                      {% set ns.suppress_members = true %}
                      {% set still = monitored | selectattr('state', 'eq', 'off')
                           | selectattr('lc_ts', 'lt', inf) | list %}
                      {% set still_mains = still | rejectattr('is_batt') | list %}
                      {% set still_batt = still | selectattr('is_batt') | list %}
                      {% if mfu == 0 and (nowts - inf) >= (2 * ci) %}
                        {% set ns.action = 'mains_followup' %}
                        {% set ns.sentinel = '__mass__:' ~ d ~ ':' ~ inf ~ ':' ~ af ~ ':1:' ~ bfu ~ ':' ~ peak_now ~ ':' ~ reopen_n %}
                        {% if still_mains | length > 0 %}
                          {% set ns.notify = 'followup' %}
                          {% set ns.still = still_mains | map(attribute='friendly_name') | list %}
                          {% set ns.still_kind = 'mains' %}
                        {% endif %}
                      {% elif bfu == 0 and (nowts - inf) >= (battery_recovery_grace_seconds | int(3600)) %}
                        {% set ns.action = 'battery_followup' %}
                        {% set ns.sentinel = '__mass__:' ~ d ~ ':' ~ inf ~ ':' ~ af ~ ':' ~ mfu ~ ':1:' ~ peak_now ~ ':' ~ reopen_n %}
                        {% if still_batt | length > 0 %}
                          {% set ns.notify = 'followup' %}
                          {% set ns.still = still_batt | map(attribute='friendly_name') | list %}
                          {% set ns.still_kind = 'battery' %}
                        {% endif %}
                      {% elif (nowts - d) >= max_secs
                              or (mfu == 1 and bfu == 1 and still | length == 0) %}
                        {% set ns.action = 'close' %}
                        {% set ns.sentinel = '' %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
                {{ {
                  'action': ns.action, 'sentinel': ns.sentinel, 'notify': ns.notify,
                  'run_remediation': ns.run_remediation,
                  'suppress_all': ns.suppress_all, 'suppress_members': ns.suppress_members,
                  'detected': ns.detected, 'infra': ns.infra,
                  'still_devices': ns.still, 'still_kind': ns.still_kind,
                  'offline_count': off_ct, 'monitored_count': mon_ct,
                  'offline_fraction': (frac | round(1)),
                  'trigger_reason': reason,
                  'bridge_entity': (bb.bad[0] if bb.bad | length > 0 else ''),
                  'affected': (moff | map(attribute='friendly_name') | list)
                } }}
          # ---- "Due" devices: offline past their effective threshold and not
          # ---- already notified. Empty while a mass outage suppresses all
          # ---- per-device handling; episode members are excluded during the
          # ---- trailing (post-recovery) phase.
          - variables:
              due_devices: >-
                {% set ns = namespace(items=[]) %}
                {% if not mass.suppress_all %}
                {% for m in monitored | selectattr('state', 'eq', 'off') | list %}
                  {% set eff = battery_threshold_seconds | int(0)
                       if (m.is_batt and (battery_threshold_seconds | int(0)) > 0)
                       else threshold_seconds | int(0) %}
                  {% set is_member = mass.suppress_members and mass.infra > 0 and m.lc_ts < mass.infra %}
                  {% if (m.offline_seconds >= eff) and (m.device_name not in current_notified) and (not is_member) %}
                    {% set ns.items = ns.items + [{'entity_id': m.entity_id, 'device_name': m.device_name,
                         'friendly_name': m.friendly_name, 'offline_seconds': m.offline_seconds,
                         'threshold_seconds': eff, 'battery_powered': m.is_batt}] %}
                  {% endif %}
                {% endfor %}
                {% endif %}
                {{ ns.items }}
          # ---- Devices still listed in the helper but now reporting online —
          # ---- their recovery event was missed. Same suppression rules.
          - variables:
              recovered_devices: >-
                {% set ns = namespace(items=[]) %}
                {% if not mass.suppress_all %}
                {% for m in monitored | selectattr('state', 'eq', 'on') | list %}
                  {% set is_member = mass.suppress_members and mass.infra > 0 and m.lc_ts < mass.infra %}
                  {% if (m.device_name in current_notified) and (not is_member) %}
                    {% set ns.items = ns.items + [{'entity_id': m.entity_id, 'device_name': m.device_name,
                         'friendly_name': m.friendly_name}] %}
                  {% endif %}
                {% endfor %}
                {% endif %}
                {{ ns.items }}
          # ---- MASS OUTAGE: one-time remediation action.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ mass.run_remediation }}"
                sequence:
                  - variables:
                      offline_count: "{{ mass.offline_count }}"
                      monitored_count: "{{ mass.monitored_count }}"
                      offline_fraction: "{{ mass.offline_fraction }}"
                      affected_devices: "{{ mass.affected }}"
                      trigger_reason: "{{ mass.trigger_reason }}"
                      bridge_entity: "{{ mass.bridge_entity }}"
                      outage_started: "{{ mass.detected | timestamp_local if mass.detected else '' }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ true }}"
                        sequence: !input mass_outage_actions
          # ---- MASS OUTAGE: aggregated alert / reminder.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ mass.notify in ['outage', 'reminder'] and notification_devices | length > 0 }}
                sequence:
                  - variables:
                      offline_count: "{{ mass.offline_count }}"
                      monitored_count: "{{ mass.monitored_count }}"
                      offline_fraction: "{{ mass.offline_fraction }}"
                      affected_devices: "{{ mass.affected }}"
                      trigger_reason: "{{ mass.trigger_reason }}"
                      bridge_entity: "{{ mass.bridge_entity }}"
                      is_reminder: "{{ mass.notify == 'reminder' }}"
                      outage_started: "{{ mass.detected | timestamp_local if mass.detected else '' }}"
                      outage_duration: "{{ (as_timestamp(now()) | int) - mass.detected if mass.detected else 0 }}"
                      notification_time: "{{ now().strftime(timestamp_format) }}"
                      mass_notification_data: >-
                        {{ dict(offline_message_data,
                           **{'subtitle': notification_time, 'subject': notification_time})
                           if notification_timestamp_enabled else offline_message_data }}
                  - repeat:
                      for_each: "{{ notification_devices | list }}"
                      sequence:
                        - action: >-
                            notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                          data:
                            title: !input mass_outage_title
                            message: !input mass_outage_message
                            data: "{{ mass_notification_data }}"
          # ---- MASS OUTAGE: infrastructure recovered.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ mass.notify == 'recovery' and notification_devices | length > 0 }}
                sequence:
                  - variables:
                      monitored_count: "{{ mass.monitored_count }}"
                      recovered_count: "{{ mass.monitored_count - mass.offline_count }}"
                      still_offline_count: "{{ mass.offline_count }}"
                      outage_started: "{{ mass.detected | timestamp_local if mass.detected else '' }}"
                      outage_duration: "{{ (mass.infra - mass.detected) if (mass.infra and mass.detected) else 0 }}"
                      notification_time: "{{ now().strftime(timestamp_format) }}"
                      mass_notification_data: >-
                        {{ dict(online_message_data,
                           **{'subtitle': notification_time, 'subject': notification_time})
                           if notification_timestamp_enabled else online_message_data }}
                  - repeat:
                      for_each: "{{ notification_devices | list }}"
                      sequence:
                        - action: >-
                            notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                          data:
                            title: !input mass_recovery_title
                            message: !input mass_recovery_message
                            data: "{{ mass_notification_data }}"
          # ---- MASS OUTAGE: not-recovered follow-up (mains or battery).
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ mass.notify == 'followup' and notification_devices | length > 0 }}
                sequence:
                  - variables:
                      followup_kind: "{{ mass.still_kind }}"
                      still_offline_devices: "{{ mass.still_devices }}"
                      still_offline_count: "{{ mass.still_devices | length }}"
                      outage_started: "{{ mass.detected | timestamp_local if mass.detected else '' }}"
                      notification_time: "{{ now().strftime(timestamp_format) }}"
                      mass_notification_data: >-
                        {{ dict(offline_message_data,
                           **{'subtitle': notification_time, 'subject': notification_time})
                           if notification_timestamp_enabled else offline_message_data }}
                  - repeat:
                      for_each: "{{ notification_devices | list }}"
                      sequence:
                        - action: >-
                            notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                          data:
                            title: !input mass_followup_title
                            message: !input mass_followup_message
                            data: "{{ mass_notification_data }}"
          # ---- Per-device offline notifications + actions (skipped entirely
          # ---- while a mass outage suppresses per-device handling).
          - repeat:
              for_each: "{{ due_devices }}"
              sequence:
                - variables:
                    entity_id: "{{ repeat.item.entity_id }}"
                    device_name: "{{ repeat.item.device_name }}"
                    friendly_name: "{{ repeat.item.friendly_name }}"
                    offline_seconds: "{{ repeat.item.offline_seconds }}"
                    threshold_seconds: "{{ repeat.item.threshold_seconds }}"
                    battery_powered: "{{ repeat.item.battery_powered }}"
                    offline_timestamp: "{{ now() }}"
                    offline_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                    notification_time: "{{ now().strftime(timestamp_format) }}"
                    offline_notification_data: >-
                      {{ dict(offline_message_data,
                         **{'subtitle': notification_time, 'subject': notification_time})
                         if notification_timestamp_enabled else offline_message_data }}
                # OPTIONAL OFFLINE NOTIFICATION (MULTI-DEVICE)
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ offline_notifications_enabled and notification_devices | length > 0 }}
                      sequence:
                        - repeat:
                            for_each: "{{ notification_devices | list }}"
                            sequence:
                              - action: >-
                                  notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                                data:
                                  title: !input offline_title
                                  message: !input offline_message
                                  data: "{{ offline_notification_data }}"
                # OPTIONAL OFFLINE ACTIONS
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input offline_actions
          # SELF-HEAL: devices that recovered while their online event was
          # missed. Optionally notify / run online_actions per self_heal_notify;
          # the helper write below removes them regardless.
          - repeat:
              for_each: "{{ recovered_devices }}"
              sequence:
                - variables:
                    entity_id: "{{ repeat.item.entity_id }}"
                    device_name: "{{ repeat.item.device_name }}"
                    friendly_name: "{{ repeat.item.friendly_name }}"
                    online_timestamp: "{{ now() }}"
                    online_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                    notification_time: "{{ now().strftime(timestamp_format) }}"
                    online_notification_data: >-
                      {{ dict(online_message_data,
                         **{'subtitle': notification_time, 'subject': notification_time})
                         if notification_timestamp_enabled else online_message_data }}
                # OPTIONAL SELF-HEAL ONLINE NOTIFICATION (MULTI-DEVICE)
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ self_heal_notify and online_notifications_enabled
                               and notification_devices | length > 0 }}
                      sequence:
                        - repeat:
                            for_each: "{{ notification_devices | list }}"
                            sequence:
                              - action: >-
                                  notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                                data:
                                  title: !input online_title
                                  message: !input online_message
                                  data: "{{ online_notification_data }}"
                # OPTIONAL SELF-HEAL ONLINE ACTIONS
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ self_heal_notify }}"
                      sequence: !input online_actions
          # ---- Single batched helper write for the whole run. The optional
          # ---- mass-outage marker is kept as the first pipe-delimited field,
          # ---- followed by the tracked device names. When the result would
          # ---- exceed the 255-character Input Text limit it is truncated and
          # ---- (optionally) a persistent notification is raised.
          - variables:
              new_sentinel: "{{ mass.sentinel if (mass_outage_enabled | bool(false)) else mass_raw }}"
              helper_devices: >-
                {{ (current_notified
                    | reject('in', recovered_devices | map(attribute='device_name') | list)
                    | list)
                   + (due_devices | map(attribute='device_name') | list) }}
          - variables:
              helper_parts: "{{ ([new_sentinel] if new_sentinel else []) + helper_devices }}"
          - variables:
              helper_candidate: "{{ helper_parts | join('|') }}"
              helper_parts_fit: >-
                {% set ns = namespace(acc=[], len=0, done=false) %}
                {% for item in helper_parts %}
                {% if not ns.done %}
                {% set addl = (item | length) + (1 if ns.acc else 0) %}
                {% if ns.len + addl <= 250 %}
                {% set ns.acc = ns.acc + [item] %}
                {% set ns.len = ns.len + addl %}
                {% else %}
                {% set ns.done = true %}
                {% endif %}
                {% endif %}
                {% endfor %}
                {{ ns.acc }}
          - variables:
              helper_overflow: "{{ (helper_candidate | length) > 250 }}"
              helper_value: "{{ helper_candidate if (helper_candidate | length) <= 250 else (helper_parts_fit | join('|')) }}"
          - if:
              - condition: template
                value_template: >-
                  {{ (due_devices | length > 0) or (recovered_devices | length > 0)
                     or (new_sentinel != mass_raw) }}
            then:
              - action: input_text.set_value
                target:
                  entity_id: !input notified_helper
                data:
                  value: "{{ helper_value }}"
          - if:
              - condition: template
                value_template: "{{ (warn_on_helper_full | bool(true)) and helper_overflow }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: mqtt_csm_helper_full
                  title: MQTT Connection State Monitor
                  message: >-
                    Tracking helper full: only part of the offline-device list fits in the
                    255-character Input Text limit, so duplicate offline alerts are likely
                    for the rest until the helper is cleared, monitoring is split across
                    multiple helpers, or Mass Outage Detection is enabled.
            else:
              - if:
                  - condition: template
                    value_template: "{{ warn_on_helper_full | bool(true) }}"
                then:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: mqtt_csm_helper_full
